---
# =============================================================================
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0 - Level 1 Server
# Valores por defecto alineados a CIS_Ubuntu_Linux_24.04_LTS_v2.0.0_L1_Server.audit
# Sobrescribe lo necesario en group_vars/all.yml (no edites este archivo).
# =============================================================================

# --- Control general ---------------------------------------------------------
# Lista de IDs CIS que NO se deben tocar en este host/grupo (ej. ["1.5.3", "5.1.16"])
cis_skip_controls: []

# Directorio local (en el controlador) donde se dejan los reportes por host
cis_report_dir: "{{ playbook_dir }}/reports"
# Copia del reporte en el propio host
cis_report_dir_remote: /var/log/cis
# Timeout (s) para búsquedas en todo el FS (equivale a FIND_TIMEOUT del .audit)
cis_find_timeout: 7200
# Sistemas de archivos excluidos en búsquedas de 7.1.11-7.1.13 (rendimiento)
cis_find_exclude_fstypes: [nfs, nfs4, cifs, smbfs, proc, sysfs, tmpfs, devtmpfs, overlay, squashfs, fuse.sshfs, autofs]

# --- 1.1.1 Módulos de kernel (filesystems) -----------------------------------
# NO se incluyen usb-storage (1.1.1.10) ni "unused filesystems" (1.1.1.11): revisión manual
# (usb-storage lo usan iLO/iDRAC/virtual media; bloquear FS en uso puede ser fatal).
cis_kernel_modules_fs:
  - { id: "1.1.1.1", mod: cramfs }
  - { id: "1.1.1.2", mod: freevxfs }
  - { id: "1.1.1.3", mod: hfs }
  - { id: "1.1.1.4", mod: hfsplus }
  - { id: "1.1.1.5", mod: jffs2 }
  - { id: "1.1.1.9", mod: firewire-core }
# 3.2.x protocolos de red poco comunes
cis_kernel_modules_net:
  - { id: "3.2.1", mod: atm }
  - { id: "3.2.2", mod: can }
  - { id: "3.2.3", mod: dccp }
  - { id: "3.2.4", mod: rds }
  - { id: "3.2.5", mod: sctp }
  - { id: "3.2.6", mod: tipc }
# Si un módulo está CARGADO (en uso) no se bloquea, se reporta para revisión.
cis_modules_skip_if_loaded: true

# --- 1.3.1 AppArmor ----------------------------------------------------------
cis_apparmor_restrict_unprivileged_unconfined: true   # 1.3.1.4

# --- 1.5 Kernel / procesos ---------------------------------------------------
cis_disable_apport: true            # 1.5.7

# --- 1.6 Banners -------------------------------------------------------------
cis_banner_text: "All activities performed on this system will be monitored."
cis_ssh_banner_file: /etc/issue.net
# 1.6.1/1.6.4: Ubuntu genera MOTD dinámico (/etc/update-motd.d) con referencias a "Ubuntu".
# true = mueve esos scripts a /etc/update-motd.d.cis-disabled (reversible).
cis_motd_disable_dynamic: true

# --- 1.7 GDM (solo aplica si gdm3 está instalado) ----------------------------
cis_gdm_idle_delay: 900   # <= 900, != 0
cis_gdm_lock_delay: 5     # <= 5

# --- 2.1 Servicios -----------------------------------------------------------
# Servicios que la organización APRUEBA en este host (no se tocan). Usa el nombre
# de control CIS o el paquete, p.ej. ["apache2", "nginx", "rsync"].
cis_services_approved: []
# Un servicio instalado y ACTIVO no se enmascara (podría tumbar producción):
# se reporta para revisión manual. Solo se enmascaran los instalados e inactivos.
cis_services_mask_only_inactive: true

cis_services:
  - { id: "2.1.1",  pkg: [autofs],                          units: [autofs.service] }
  - { id: "2.1.3",  pkg: [avahi-daemon],                    units: [avahi-daemon.socket, avahi-daemon.service] }
  - { id: "2.1.5",  pkg: [kea, kea-dhcp4-server, kea-dhcp6-server, kea-dhcp-ddns-server, isc-dhcp-server], units: [kea-dhcp-ddns-server.service, kea-dhcp4-server.service, kea-dhcp6-server.service, isc-dhcp-server.service, isc-dhcp-server6.service] }
  - { id: "2.1.6",  pkg: [apache2],                         units: [apache2.socket, apache2.service] }
  - { id: "2.1.6",  pkg: [nginx],                           units: [nginx.service] }
  - { id: "2.1.7",  pkg: [bind9],                           units: [named.service] }
  - { id: "2.1.8",  pkg: [vsftpd],                          units: [vsftpd.service] }
  - { id: "2.1.9",  pkg: [dnsmasq],                         units: [dnsmasq.service] }
  - { id: "2.1.10", pkg: [slapd],                           units: [slapd.service] }
  - { id: "2.1.11", pkg: [dovecot-imapd, dovecot-pop3d],    units: [dovecot.socket, dovecot.service] }
  - { id: "2.1.12", pkg: [nfs-kernel-server],               units: [nfs-server.service] }
  - { id: "2.1.13", pkg: [ypserv],                          units: [ypserv.service] }
  - { id: "2.1.14", pkg: [cups],                            units: [cups.socket, cups.service] }
  - { id: "2.1.15", pkg: [rpcbind],                         units: [rpcbind.socket, rpcbind.service] }
  - { id: "2.1.16", pkg: [rsync],                           units: [rsync.service] }
  - { id: "2.1.17", pkg: [samba],                           units: [smbd.service] }
  - { id: "2.1.18", pkg: [snmpd],                           units: [snmpd.service] }
  - { id: "2.1.19", pkg: [telnetd, inetutils-telnetd],      units: [inetutils-inetd.service] }
  - { id: "2.1.20", pkg: [tftpd-hpa],                       units: [tftpd-hpa.service] }
  - { id: "2.1.21", pkg: [squid],                           units: [squid.service] }
  - { id: "2.1.22", pkg: [xinetd],                          units: [xinetd.service] }

# --- 2.2 Clientes inseguros (se desinstalan) ---------------------------------
cis_insecure_clients:
  - { id: "2.2.1", pkg: [nis] }
  - { id: "2.2.2", pkg: [rsh-client] }
  - { id: "2.2.3", pkg: [talk] }
  - { id: "2.2.4", pkg: [telnet, inetutils-telnet] }
  - { id: "2.2.5", pkg: [ldap-utils] }
  - { id: "2.2.6", pkg: [ftp, tnftp] }

# --- 2.3 Sincronización de tiempo --------------------------------------------
# 2.3.2.1 / 2.3.3.1: servidores de tiempo autorizados. Por defecto los del ejemplo
# del benchmark (NIST). SUSTITUIR por los NTP internos (o cronos.cenam.mx) si la red
# no permite NTP (UDP/123) hacia Internet.
cis_ntp_servers: [time.nist.gov]
cis_ntp_fallback_servers: [time-a-g.nist.gov, time-b-g.nist.gov, time-c-g.nist.gov]

# --- 2.4 cron / at -----------------------------------------------------------
# cron.allow se crea con root + usuarios que YA tienen crontab + esta lista,
# para no romper tareas programadas existentes.
cis_cron_allow_users: []
cis_at_allow_users: []

# --- 3.3 Parámetros de red ---------------------------------------------------
# 3.3.1.2/3.3.1.3/3.3.2.1/3.3.2.2: forwarding = 0.
# false = se aplica aunque esté en 1 en runtime (requerido por CIS).
cis_forwarding_only_if_disabled: false
# Protección: si Docker/containerd/Podman/kubelet/k3s están ACTIVOS no se apaga el
# forwarding (los contenedores pierden red). Pon false para forzarlo igualmente.
cis_forwarding_skip_if_containers: true

# --- 5.1 SSH -----------------------------------------------------------------
cis_sshd_dropin: /etc/ssh/sshd_config.d/01-cis-hardening.conf
cis_sshd_client_alive_interval: 15
cis_sshd_client_alive_count_max: 3
cis_sshd_login_grace_time: 60
cis_sshd_log_level: VERBOSE
cis_sshd_max_auth_tries: 4
cis_sshd_max_startups: "10:30:60"
cis_sshd_max_sessions: 10

# --- 5.2 sudo ----------------------------------------------------------------
cis_sudo_logfile: /var/log/sudo.log
cis_sudo_timestamp_timeout: 15

# --- 5.3 PAM (solo archivos de configuración de módulos; NO se edita /etc/pam.d)
cis_faillock_deny: 5            # 5.3.3.1.1  (1-5)
cis_faillock_unlock_time: 900   # 5.3.3.1.2  (0 o >= 900)
cis_pwquality:
  difok: 2          # 5.3.3.2.1
  minlen: 14        # 5.3.3.2.2
  minclass: 4       # 5.3.3.2.3
  maxrepeat: 3      # 5.3.3.2.4
  maxsequence: 3    # 5.3.3.2.5
  dictcheck: 1      # 5.3.3.2.6
  enforcing: 1      # 5.3.3.2.7
cis_pwhistory_remember: 24      # 5.3.3.3.1

# --- 5.4 Cuentas / login.defs ------------------------------------------------
cis_pass_max_days: 365          # 5.4.1.1 (solo login.defs; usuarios existentes = manual)
cis_pass_warn_age: 7            # 5.4.1.3
cis_pass_warn_age_existing_users: true
cis_encrypt_method: YESCRYPT    # 5.4.1.4 (SHA512|YESCRYPT)
cis_inactive_days: 45           # 5.4.1.5 (solo useradd -D; usuarios existentes = manual)
cis_shell_tmout: 900            # 5.4.3.2
cis_umask: "027"                # 5.4.3.3 / 5.4.2.6

# --- 6.1 Logging -------------------------------------------------------------
cis_journald:
  ForwardToSyslog: "yes"        # 6.1.1.1.3
  Storage: persistent           # 6.1.1.1.6
  Compress: "yes"               # 6.1.1.1.7
  SystemMaxUse: 1G              # 6.1.1.1.5
  SystemKeepFree: 500M
  RuntimeMaxUse: 200M
  RuntimeKeepFree: 50M
  MaxFileSec: 1month
# 6.1.2.4: agrega las reglas de logging CIS en /etc/rsyslog.d/60-cis.conf
cis_rsyslog_rules: true
# 6.1.2.5: si se define, se configura el reenvío remoto. Vacío = revisión manual.
cis_rsyslog_remote_host: ""
cis_rsyslog_remote_port: 514
cis_rsyslog_remote_protocol: tcp
# 6.1.3.1: aplica el script CIS de permisos/propietarios en /var/log
cis_fix_varlog_permissions: true

# --- 6.3 AIDE ----------------------------------------------------------------
cis_aide_install: true

# =============================================================================
# CONTROLES CRÍTICOS (antes solo de revisión manual). Se aplican los que estén en
# esta lista. Para no aplicar alguno en un host/grupo, quítalo de la lista o
# agrégalo a cis_skip_controls.
# =============================================================================
cis_critical_controls:
  - "1.1.1.10"    # usb-storage
  - "1.1.1.11"    # módulos de filesystem no usados
  - "1.1.2.x"     # /tmp, /dev/shm, /home, /var, /var/tmp, /var/log, /var/log/audit
  - "2.1.2"       # MTA solo loopback
  - "2.1.4"       # servicios no aprobados (lista cis_unapproved_*)
  - "2.3.2.1"     # NTP autorizado (timesyncd)
  - "2.3.3.1"     # NTP autorizado (chrony)
  - "3.1.1"       # IPv6 (cis_ipv6_disable)
  - "3.3.2.7"     # accept_ra all
  - "3.3.2.8"     # accept_ra default
  - "5.1.4"       # AllowGroups
  - "5.1.6"       # Ciphers
  - "5.1.12"      # KexAlgorithms
  - "5.1.15"      # MACs
  - "5.1.20"      # PermitRootLogin no
  - "5.1.23"      # KEX post-cuántico
  - "5.2.7"       # su restringido (pam_wheel)
  - "5.3.2.x"     # pam_unix, pam_faillock, pam_pwquality, pam_pwhistory
  - "5.3.3.4.x"   # pam_unix sin nullok/remember, yescrypt, use_authtok
  - "5.4.1.1"     # PASS_MAX_DAYS en usuarios existentes
  - "5.4.1.5"     # INACTIVE en usuarios existentes
  - "5.4.2.5"     # integridad del PATH de root
  - "7.1.11"      # archivos/directorios world-writable

# --- 1.1.1.11: módulos de filesystem que NUNCA se bloquean aunque no estén en uso
# (además se excluyen automáticamente los montados y los cargados).
cis_fs_modules_keep: [ext4, xfs, btrfs, vfat, fat, overlay, squashfs, fuse, nfs, nfsv3, nfsv4, autofs4, efivarfs, isofs]

# --- 1.1.2.x: opciones de montaje requeridas
cis_mounts:
  - { id: "1.1.2.1", path: /tmp,           opts: [nodev, nosuid, noexec] }
  - { id: "1.1.2.2", path: /dev/shm,       opts: [nodev, nosuid, noexec] }
  - { id: "1.1.2.3", path: /home,          opts: [nodev, nosuid] }
  - { id: "1.1.2.4", path: /var,           opts: [nodev, nosuid] }
  - { id: "1.1.2.5", path: /var/tmp,       opts: [nodev, nosuid, noexec] }
  - { id: "1.1.2.6", path: /var/log,       opts: [nodev, nosuid, noexec] }
  - { id: "1.1.2.7", path: /var/log/audit, opts: [nodev, nosuid, noexec] }
# Si el directorio NO es una partición separada se monta como bind sobre sí mismo
# con las opciones (aplica nodev/nosuid/noexec sin reparticionar; no da aislamiento
# de espacio en disco). false = solo se ajustan particiones que ya existen.
cis_mounts_bind_if_not_separate: true
# Aplicar en caliente (mount/remount). Si el punto tiene submontajes (p.ej. Docker
# en /var/lib/docker) NO se toca en caliente y queda para el siguiente reinicio.
cis_mounts_apply_live: true

# --- 2.1.4: servicios/paquetes NO aprobados (llenar con base en el reporte 2.1.4)
cis_unapproved_services: []     # ej. ["cups.service", "avahi-daemon.socket"]
cis_unapproved_packages: []     # ej. ["cups"]

# --- 3.1.1: deshabilitar IPv6 por sysctl (reversible). false = se deja habilitado
# (el control solo exige que el estado esté identificado/documentado).
cis_ipv6_disable: true

# --- 5.1.4: acceso SSH por grupo
cis_ssh_allow_group: sshusers
cis_ssh_allowed_users: []          # usuarios adicionales con acceso SSH
# Agregar automáticamente al grupo a los miembros actuales de sudo/admin
cis_ssh_allow_sudo_members: true
# El usuario con el que Ansible se conecta siempre se agrega (evita bloqueo).

# --- 5.1.6 / 5.1.12 / 5.1.15 / 5.1.23: algoritmos permitidos (se filtran contra
# los que soporta el OpenSSH instalado; el orden define la preferencia).
cis_sshd_ciphers: [aes256-gcm@openssh.com, aes128-gcm@openssh.com, aes256-ctr, aes192-ctr, aes128-ctr]
cis_sshd_kex: [mlkem768x25519-sha256, sntrup761x25519-sha512, sntrup761x25519-sha512@openssh.com, curve25519-sha256, curve25519-sha256@libssh.org, ecdh-sha2-nistp521, ecdh-sha2-nistp384, ecdh-sha2-nistp256, diffie-hellman-group18-sha512, diffie-hellman-group16-sha512, diffie-hellman-group-exchange-sha256]
cis_sshd_macs: [hmac-sha2-512-etm@openssh.com, hmac-sha2-256-etm@openssh.com, hmac-sha2-512, hmac-sha2-256]

# --- 5.2.7: grupo (vacío) autorizado para usar su
cis_su_group: sugroup

# --- 5.3.2.x / 5.3.3.4.x: si los archivos /etc/pam.d/common-* tienen cambios
# locales, pam-auth-update no los sobrescribe. true = forzar (--force).
cis_pam_auth_update_force: false

# --- 5.4.1.1 / 5.4.1.5: usuarios excluidos del cambio de caducidad
cis_password_aging_exclude: []

# --- 7.1.11: rutas adicionales a excluir (además de las del benchmark)
cis_ww_extra_exclude_paths: ["/var/lib/docker/*"]

# --- Red de seguridad para SSH/PAM (restauración automática si no se confirma acceso)
cis_rollback_enabled: true
cis_rollback_minutes: 30
cis_rollback_dir: /var/backups/cis-rollback
