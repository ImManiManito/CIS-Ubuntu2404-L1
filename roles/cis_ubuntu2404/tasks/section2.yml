---
# =============================================================================
# SECCIÓN 2 - Servicios
# Excluidos (revisión manual): 2.1.2 (MTA local-only), 2.1.4 (puertos en escucha),
#   2.3.1.1 (un solo demonio de tiempo), servicios 2.1.x ACTIVOS (se reportan).
# Estrategia 2.1.x: NO se desinstalan paquetes servidor; si están instalados e
#   inactivos se detienen y enmascaran (reversible con systemctl unmask).
# =============================================================================

# ---------------------------------------------------------------- 2.1 ---------
- name: "2.1.x | Estado de servicios servidor no requeridos (instalados)"
  ansible.builtin.command:
    argv: "{{ ['systemctl', 'is-active'] + item.units }}"
  loop: "{{ cis_services }}"
  loop_control:
    label: "{{ item.id }} {{ item.pkg | join(',') }}"
  register: cis_svc_state
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cis_systemd
    - item.id not in cis_skip_controls
    - (item.pkg | intersect(ansible_facts.packages.keys() | list)) | length > 0
    - (item.pkg | intersect(cis_services_approved)) | length == 0
    - item.id not in cis_services_approved
  tags: [cis_2.1.1, cis_2.1.3, cis_2.1.5, cis_2.1.6, cis_2.1.7, cis_2.1.8, cis_2.1.9, cis_2.1.10, cis_2.1.11,
         cis_2.1.12, cis_2.1.13, cis_2.1.14, cis_2.1.15, cis_2.1.16, cis_2.1.17, cis_2.1.18, cis_2.1.19,
         cis_2.1.20, cis_2.1.21, cis_2.1.22, services]

- name: "2.1.x | Clasificar servicios (inactivos = enmascarar, activos = revisión manual)"
  ansible.builtin.set_fact:
    cis_svc_evaluated: "{{ cis_svc_state.results | default([]) | selectattr('stdout_lines', 'defined') | list }}"
  tags: [cis_2.1.1, cis_2.1.3, cis_2.1.5, cis_2.1.6, cis_2.1.7, cis_2.1.8, cis_2.1.9, cis_2.1.10, cis_2.1.11,
         cis_2.1.12, cis_2.1.13, cis_2.1.14, cis_2.1.15, cis_2.1.16, cis_2.1.17, cis_2.1.18, cis_2.1.19,
         cis_2.1.20, cis_2.1.21, cis_2.1.22, services]

- name: "2.1.x | Listas de enmascarado y diferidos"
  ansible.builtin.set_fact:
    cis_svc_to_mask: >-
      {{ (cis_svc_evaluated if not cis_services_mask_only_inactive | bool
          else (cis_svc_evaluated | rejectattr('stdout_lines', 'contains', 'active') | list))
         | map(attribute='item') | list }}
    cis_svc_active: >-
      {{ (cis_svc_evaluated | selectattr('stdout_lines', 'contains', 'active') | map(attribute='item') | list)
         if cis_services_mask_only_inactive | bool else [] }}
  tags: [cis_2.1.1, cis_2.1.3, cis_2.1.5, cis_2.1.6, cis_2.1.7, cis_2.1.8, cis_2.1.9, cis_2.1.10, cis_2.1.11,
         cis_2.1.12, cis_2.1.13, cis_2.1.14, cis_2.1.15, cis_2.1.16, cis_2.1.17, cis_2.1.18, cis_2.1.19,
         cis_2.1.20, cis_2.1.21, cis_2.1.22, services]

- name: "2.1.x | Detener y enmascarar servicios no requeridos inactivos"
  ansible.builtin.systemd_service:
    name: "{{ item.1 }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ cis_svc_to_mask | subelements('units') }}"
  loop_control:
    label: "{{ item.0.id }} {{ item.1 }}"
  when: item.1 in cis_unit_files
  tags: [cis_2.1.1, cis_2.1.3, cis_2.1.5, cis_2.1.6, cis_2.1.7, cis_2.1.8, cis_2.1.9, cis_2.1.10, cis_2.1.11,
         cis_2.1.12, cis_2.1.13, cis_2.1.14, cis_2.1.15, cis_2.1.16, cis_2.1.17, cis_2.1.18, cis_2.1.19,
         cis_2.1.20, cis_2.1.21, cis_2.1.22, services]

- name: "2.1.x | Registrar servicios activos para revisión manual"
  ansible.builtin.set_fact:
    cis_deferred: "{{ cis_deferred + [{'id': item.id, 'motivo': 'Servicio ' ~ (item.pkg | join('/')) ~ ' instalado y ACTIVO; no se detuvo. Si es requerido agrégalo a cis_services_approved, si no, desinstálalo/enmascáralo manualmente.'}] }}"
  loop: "{{ cis_svc_active }}"
  loop_control:
    label: "{{ item.id }} {{ item.pkg | join(',') }}"
  tags: [services]

# ---------------------------------------------------------------- 2.2 ---------
- name: "2.2.x | Desinstalar clientes inseguros"
  ansible.builtin.apt:
    name: "{{ item.pkg | intersect(ansible_facts.packages.keys() | list) }}"
    state: absent
    purge: true
  loop: "{{ cis_insecure_clients }}"
  loop_control:
    label: "{{ item.id }} {{ item.pkg | join(',') }}"
  when:
    - item.id not in cis_skip_controls
    - (item.pkg | intersect(ansible_facts.packages.keys() | list)) | length > 0
  tags: [cis_2.2.1, cis_2.2.2, cis_2.2.3, cis_2.2.4, cis_2.2.5, cis_2.2.6, clients]

# ---------------------------------------------------------------- 2.3 ---------
- name: "2.3.1.1/2.3.2.x | Sin demonio de tiempo: instalar systemd-timesyncd"
  when:
    - "'chrony' not in ansible_facts.packages"
    - "'systemd-timesyncd' not in ansible_facts.packages"
    - (['2.3.2.1', '2.3.3.1'] | intersect(cis_critical_controls) | difference(cis_skip_controls) | length) > 0
  tags: [cis_2.3.2.1, cis_2.3.2.2, time]
  block:
    - name: "2.3.2.x | Instalar systemd-timesyncd"
      ansible.builtin.apt:
        name: systemd-timesyncd
        state: present

    - name: "2.3.2.x | Refrescar inventario de paquetes"
      ansible.builtin.package_facts:
        manager: apt

- name: "2.3.3.x | chrony (si está instalado)"
  when: "'chrony' in ansible_facts.packages"
  tags: [cis_2.3.3.1, cis_2.3.3.2, cis_2.3.3.3, time]
  block:
    - name: "2.3.3.2 | chrony se ejecuta como _chrony"
      ansible.builtin.copy:
        dest: /etc/chrony/conf.d/60-cis-user.conf
        content: |
          # CIS 2.3.3.2 - Gestionado por Ansible
          user _chrony
        owner: root
        group: root
        mode: "0644"
      when: "'2.3.3.2' not in cis_skip_controls"
      notify: CIS restart chrony

    - name: "2.3.3.1 | Servidores de tiempo autorizados (si se definieron)"
      ansible.builtin.template:
        src: chrony-sources.j2
        dest: /etc/chrony/sources.d/60-cis.sources
        owner: root
        group: root
        mode: "0644"
      when:
        - "'2.3.3.1' not in cis_skip_controls"
        - "'2.3.3.1' in cis_critical_controls"
        - cis_ntp_servers | length > 0
      notify: CIS restart chrony

    - name: "2.3.3.3 | chrony habilitado y en ejecución"
      ansible.builtin.systemd_service:
        name: chrony.service
        enabled: true
        state: started
        masked: false
      when:
        - "'2.3.3.3' not in cis_skip_controls"
        - cis_systemd

- name: "2.3.2.x | systemd-timesyncd (si chrony NO está instalado)"
  when:
    - "'chrony' not in ansible_facts.packages"
    - "'systemd-timesyncd' in ansible_facts.packages"
  tags: [cis_2.3.2.1, cis_2.3.2.2, time]
  block:
    - name: "2.3.2.1 | Servidores de tiempo autorizados (si se definieron)"
      ansible.builtin.template:
        src: timesyncd-cis.conf.j2
        dest: /etc/systemd/timesyncd.conf.d/60-cis.conf
        owner: root
        group: root
        mode: "0644"
      when:
        - "'2.3.2.1' not in cis_skip_controls"
        - "'2.3.2.1' in cis_critical_controls"
        - cis_ntp_servers | length > 0
      notify: CIS restart timesyncd

    - name: "2.3.2.2 | systemd-timesyncd habilitado y en ejecución"
      ansible.builtin.systemd_service:
        name: systemd-timesyncd.service
        enabled: true
        state: started
        masked: false
      when:
        - "'2.3.2.2' not in cis_skip_controls"
        - cis_systemd

# ---------------------------------------------------------------- 2.4 ---------
- name: "2.4.1.x | cron"
  when: "'cron' in ansible_facts.packages"
  tags: [cron]
  block:
    - name: "2.4.1.1 | cron habilitado y activo"
      ansible.builtin.systemd_service:
        name: cron.service
        enabled: true
        state: started
        masked: false
      when:
        - "'2.4.1.1' not in cis_skip_controls"
        - cis_systemd
      tags: [cis_2.4.1.1]

    - name: "2.4.1.2 | Permisos de /etc/crontab (root:root, 0600)"
      ansible.builtin.file:
        path: /etc/crontab
        owner: root
        group: root
        mode: "u-x,og-rwx"
      when: "'2.4.1.2' not in cis_skip_controls"
      failed_when: false
      tags: [cis_2.4.1.2]

    - name: "2.4.1.3-2.4.1.8 | Permisos de directorios cron (root:root, 0700)"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "og-rwx"
      loop:
        - { id: "2.4.1.3", path: /etc/cron.hourly }
        - { id: "2.4.1.4", path: /etc/cron.daily }
        - { id: "2.4.1.5", path: /etc/cron.weekly }
        - { id: "2.4.1.6", path: /etc/cron.monthly }
        - { id: "2.4.1.7", path: /etc/cron.yearly }
        - { id: "2.4.1.8", path: /etc/cron.d }
      loop_control:
        label: "{{ item.id }} {{ item.path }}"
      when: item.id not in cis_skip_controls
      tags: [cis_2.4.1.3, cis_2.4.1.4, cis_2.4.1.5, cis_2.4.1.6, cis_2.4.1.7, cis_2.4.1.8]

    - name: "2.4.1.9 | Usuarios con crontab existente (se preservan en cron.allow)"
      ansible.builtin.find:
        paths: /var/spool/cron/crontabs
        file_type: file
      register: cis_crontabs
      check_mode: false
      tags: [cis_2.4.1.9]

    - name: "2.4.1.9 | Grupo propietario para cron.allow/deny"
      ansible.builtin.getent:
        database: group
        key: crontab
        fail_key: false
      tags: [cis_2.4.1.9]

    - name: "2.4.1.9 | Poblar /etc/cron.allow (root + usuarios con crontab + lista aprobada)"
      ansible.builtin.lineinfile:
        path: /etc/cron.allow
        line: "{{ item }}"
        create: true
        owner: root
        group: "{{ 'crontab' if (ansible_facts.getent_group.crontab | default(none)) is not none else 'root' }}"
        mode: "0640"
      loop: "{{ (['root'] + (cis_crontabs.files | default([]) | map(attribute='path') | map('basename') | list) + cis_cron_allow_users) | unique }}"
      when: "'2.4.1.9' not in cis_skip_controls"
      tags: [cis_2.4.1.9]

    - name: "2.4.1.9 | Permisos de /etc/cron.allow y /etc/cron.deny"
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: "{{ 'crontab' if (ansible_facts.getent_group.crontab | default(none)) is not none else 'root' }}"
        mode: "u-x,g-wx,o-rwx"
      loop: [/etc/cron.allow, /etc/cron.deny]
      when: "'2.4.1.9' not in cis_skip_controls"
      failed_when: false
      tags: [cis_2.4.1.9]

- name: "2.4.2.1 | at"
  when:
    - "'at' in ansible_facts.packages"
    - "'2.4.2.1' not in cis_skip_controls"
  tags: [cis_2.4.2.1, cron]
  block:
    - name: "2.4.2.1 | Usuarios con trabajos at existentes"
      ansible.builtin.find:
        paths: /var/spool/cron/atjobs
        file_type: file
      register: cis_atjobs
      check_mode: false

    - name: "2.4.2.1 | Grupo daemon"
      ansible.builtin.getent:
        database: group
        key: daemon
        fail_key: false

    - name: "2.4.2.1 | Poblar /etc/at.allow"
      ansible.builtin.lineinfile:
        path: /etc/at.allow
        line: "{{ item }}"
        create: true
        owner: root
        group: "{{ 'daemon' if (ansible_facts.getent_group.daemon | default(none)) is not none else 'root' }}"
        mode: "0640"
      loop: "{{ (['root'] + (cis_atjobs.files | default([]) | map(attribute='pw_name') | select('defined') | list) + cis_at_allow_users) | unique }}"

    - name: "2.4.2.1 | Permisos de /etc/at.allow y /etc/at.deny"
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: "{{ 'daemon' if (ansible_facts.getent_group.daemon | default(none)) is not none else 'root' }}"
        mode: "u-x,g-wx,o-rwx"
      loop: [/etc/at.allow, /etc/at.deny]
      failed_when: false
